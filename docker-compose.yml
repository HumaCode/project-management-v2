services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-management-v2-app
    container_name: pm_v2_app
    restart: always
    ports:
      # Port 8090 di-bind ke 127.0.0.1 agar disalurkan via Reverse Proxy 1Panel (OpenResty/Nginx)
      - "127.0.0.1:${APP_PORT:-8090}:80"
    volumes:
      - .:/app
    environment:
      - APP_ENV=production
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=https://pm.humacode.my.id
      - APP_KEY=${APP_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-806449003239-6ksimualu5c0juqa23sm9i9bvf8bfg7t.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://pm.humacode.my.id/auth/google/callback}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-project_management_v2}
      - DB_USERNAME=${DB_USERNAME:-pm_user}
      - DB_PASSWORD=${DB_PASSWORD:-SecretPassword123}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-6LffI0wtAAAAAHiC-PBuv7cWRiZXnVr6W91E6tIA}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-6LffI0wtAAAAAIRwUrzY553ZpQCVnUF_4tYnLq9u}
      - BROADCAST_CONNECTION=pusher
      - PUSHER_APP_ID=${PUSHER_APP_ID:-2178088}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-afec6d87daf79334a34f}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-dac810d8ae55e130b81d}
      - PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER:-ap1}
      - VITE_PUSHER_APP_KEY=${VITE_PUSHER_APP_KEY:-afec6d87daf79334a34f}
      - VITE_PUSHER_APP_CLUSTER=${VITE_PUSHER_APP_CLUSTER:-ap1}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-temflin1@gmail.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-lihbatetbsmpugub}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-temflin1@gmail.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Project Management System}
    depends_on:
      - db
    networks:
      - pm-network

  db:
    image: mariadb:10.11
    container_name: pm_v2_db
    restart: always
    ports:
      # Port 3308 di-bind ke 127.0.0.1 (menghindari bentrok port 3306 & 3307 yang sudah terpakai)
      - "127.0.0.1:${DB_EXPOSE_PORT:-3308}:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-project_management_v2}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-SecretPassword123}
      - MYSQL_USER=${DB_USERNAME:-pm_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-SecretPassword123}
    volumes:
      - pm_db_data:/var/lib/mysql
    networks:
      - pm-network

networks:
  pm-network:
    driver: bridge

volumes:
  pm_db_data:
